<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SZ Downloader - TikTok HD</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* منع السكرولنج نهائياً */
            background: #0a0015;
            color: #fff;
            position: relative;
        }
        /* ===== خلفية النجوم (Canvas) ===== */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 30%, #150025, #080010);
        }
        /* ===== الطبقة الرئيسية ===== */
        .main-layer {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* ===== البطاقة المركزية (Glassmorphism) ===== */
        .glass-card {
            max-width: 680px;
            width: 100%;
            background: rgba(20, 5, 40, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(150, 80, 255, 0.35);
            border-radius: 48px;
            padding: 42px 40px;
            box-shadow: 0 30px 80px rgba(80, 0, 200, 0.5), 0 0 120px rgba(120, 50, 255, 0.2);
            text-align: center;
            transition: 0.3s;
            animation: floatIn 0.8s ease-out;
        }
        @keyframes floatIn {
            0% { opacity: 0; transform: scale(0.92) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        /* ===== الشعار والترحيب ===== */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .brand-icon {
            font-size: 38px;
            background: linear-gradient(145deg, #a855f7, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand h1 {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #8b5cf6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .welcome-sub {
            color: #c4b5d4;
            font-size: 15px;
            margin-top: -4px;
            margin-bottom: 24px;
            border-bottom: 1px solid #2d1b4a;
            padding-bottom: 16px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
        .welcome-sub span {
            color: #a78bfa;
            font-weight: 600;
        }
        /* ===== حقل الإدخال ===== */
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(10, 0, 25, 0.6);
            border: 1.5px solid #3b1f66;
            border-radius: 60px;
            padding: 4px 4px 4px 20px;
            transition: 0.3s;
            box-shadow: inset 0 2px 15px rgba(0,0,0,0.6);
            margin-bottom: 16px;
        }
        .input-wrapper:focus-within {
            border-color: #a855f7;
            box-shadow: 0 0 30px #7c3aed55, inset 0 2px 15px #000;
        }
        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 16px 0;
            color: #f0e6ff;
            font-size: 16px;
            outline: none;
            min-width: 0;
            direction: ltr;
        }
        .input-wrapper input::placeholder {
            color: #6b4e8a;
            font-weight: 300;
        }
        .paste-btn {
            background: #2d1b4a;
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            color: #c4b5d4;
            font-size: 20px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid #4a2a6e;
        }
        .paste-btn:hover {
            background: #7c3aed;
            color: #fff;
            box-shadow: 0 0 30px #7c3aed88;
            transform: scale(1.05);
        }
        .paste-btn:active { transform: scale(0.92); }
        /* ===== زر التحميل ===== */
        .download-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(145deg, #8b5cf6, #6d28d9);
            border: none;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 35px #6d28d966;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 4px;
        }
        .download-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 50px #7c3aedaa;
            background: linear-gradient(145deg, #9d71fd, #7c3aed);
        }
        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .download-btn .icon-dl {
            font-size: 24px;
        }
        /* ===== رسالة الخطأ ===== */
        .error-msg {
            color: #f87171;
            font-size: 14px;
            margin-top: 14px;
            min-height: 24px;
            font-weight: 500;
            background: #2a0f1a44;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #7f1d2d33;
            display: inline-block;
            backdrop-filter: blur(4px);
        }
        /* ===== شريط الحالة السفلي ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            color: #5a3d7a;
            font-size: 12px;
            border-top: 1px solid #1f0e33;
            padding-top: 14px;
        }
        .status-bar .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #a78bfa;
            border-radius: 50%;
            margin-left: 6px;
            animation: pulse-dot 1.8s infinite;
        }
        @keyframes pulse-dot {
            0% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.8); }
        }
        .status-bar .version {
            background: #1f0e33;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 10px;
            color: #8b6aaa;
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 550px) {
            .glass-card { padding: 28px 18px; border-radius: 32px; }
            .brand h1 { font-size: 22px; }
            .input-wrapper { padding: 2px 2px 2px 14px; }
            .input-wrapper input { padding: 14px 0; font-size: 14px; }
            .paste-btn { width: 44px; height: 44px; font-size: 17px; }
            .download-btn { font-size: 17px; padding: 16px; }
        }
        /* ===== صوت مخفي (للتأثيرات) ===== */
        #clickSound { display: none; }
    </style>
</head>
<body>

    <!-- ===== قماش النجوم ===== -->
    <canvas id="starfield"></canvas>

    <!-- ===== الصوت المخفي (يتم تشغيله عبر JS) ===== -->
    <audio id="clickSound" preload="auto">
        <source src="data:audio/wav;base64,U0lGR...=" type="audio/wav">
    </audio>
    <!-- نستخدم صوت مولّد بـ JS كاحتياطي -->

    <!-- ===== الطبقة الرئيسية ===== -->
    <div class="main-layer">
        <div class="glass-card">

            <!-- الترحيب -->
            <div class="brand">
                <span class="brand-icon">🪐</span>
                <h1>متصفح SZ</h1>
            </div>
            <div class="welcome-sub">
                <span>✨</span> لتنزيل فيديوهات تيك توك بدون علامة مائية <span>✨</span><br />
                بأعلى دقة ممكنة
            </div>

            <!-- حقل الإدخال + زر اللصق -->
            <div class="input-wrapper">
                <input type="url" id="tiktokInput" placeholder="https://www.tiktok.com/@user/video/123456789" dir="ltr" />
                <button class="paste-btn" id="pasteBtn" title="لصق آخر رابط من الحافظة">📋</button>
            </div>

            <!-- زر التحميل -->
            <button class="download-btn" id="downloadBtn">
                <span class="icon-dl">⬇️</span> تحميل بأعلى دقة
            </button>

            <!-- منطقة الخطأ -->
            <div id="errorDisplay" class="error-msg"></div>

            <!-- شريط الحالة -->
            <div class="status-bar">
                <span><span class="dot"></span> جاهز</span>
                <span class="version">v2.0 • SZ</span>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        //  1. نظام النجوم (Canvas) – تصعد للأبد
        // ============================================================
        (function initStars() {
            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            let width, height;
            const stars = [];
            const STAR_COUNT = 240;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // إنشاء النجوم
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2.2 + 0.6,
                    speed: Math.random() * 0.8 + 0.3,
                    opacity: Math.random() * 0.8 + 0.3,
                    twinkle: Math.random() * 0.02 + 0.005
                });
            }

            function drawStars() {
                ctx.clearRect(0, 0, width, height);

                // خلفية متدرجة (تعمق)
                const grad = ctx.createRadialGradient(width/2, height*0.3, 100, width/2, height*0.3, height*1.2);
                grad.addColorStop(0, '#1a0033');
                grad.addColorStop(1, '#05000a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // رسم النجوم
                for (let s of stars) {
                    // تحريك للأعلى
                    s.y -= s.speed;
                    if (s.y < -10) {
                        s.y = height + 10;
                        s.x = Math.random() * width;
                    }

                    // وميض خفيف
                    const flicker = Math.sin(Date.now() * s.twinkle) * 0.2 + 0.8;
                    const alpha = s.opacity * flicker;

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    // توهج أرجواني للنجوم
                    const gradient = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 2.5);
                    gradient.addColorStop(0, `rgba(200, 160, 255, ${alpha})`);
                    gradient.addColorStop(1, `rgba(120, 60, 200, 0)`);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    // لب أبيض
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.7})`;
                    ctx.fill();
                }

                requestAnimationFrame(drawStars);
            }
            drawStars();
        })();

        // ============================================================
        //  2. نظام الصوت (نقرات خفيفة)
        // ============================================================
        function playClickSound() {
            try {
                // توليد صوت نبضي باستخدام Web Audio (بدون ملف خارجي)
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.frequency.value = 1200;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.08);
            } catch(e) { /* تجاهل إن تعذر */ }
        }

        // ربط الصوت بكل النقرات المهمة
        document.querySelectorAll('button, .paste-btn, .download-btn').forEach(btn => {
            btn.addEventListener('click', playClickSound);
        });

        // ============================================================
        //  3. وظيفة اللصق من الحافظة
        // ============================================================
        const pasteBtn = document.getElementById('pasteBtn');
        const inputField = document.getElementById('tiktokInput');

        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    inputField.value = text.trim();
                    // تأثير وميض
                    inputField.style.borderColor = '#a855f7';
                    setTimeout(() => inputField.style.borderColor = '', 400);
                    playClickSound();
                }
            } catch (e) {
                // محاولة بديلة باستخدام execCommand (للأجهزة القديمة)
                try {
                    inputField.focus();
                    document.execCommand('paste');
                } catch (e2) {
                    alert('عذراً، لا يمكن الوصول إلى الحافظة. الرجاء لصق الرابط يدوياً.');
                }
            }
        });

        // ============================================================
        //  4. وظيفة التحميل الرئيسية (TikTok HD بدون علامة مائية)
        // ============================================================
        const downloadBtn = document.getElementById('downloadBtn');
        const errorDisplay = document.getElementById('errorDisplay');

        // نستخدم واجهة برمجة tikwm.com المجانية (الأكثر ثباتاً)
        const API_URL = 'https://www.tikwm.com/api/';

        downloadBtn.addEventListener('click', async () => {
            const url = inputField.value.trim();
            if (!url) {
                errorDisplay.textContent = '‼️ عذراً، أنت لم تضع رابط.';
                errorDisplay.style.color = '#f87171';
                return;
            }

            // التحقق من أن الرابط من تيك توك
            if (!url.includes('tiktok.com') && !url.includes('vm.tiktok')) {
                errorDisplay.textContent = '⚠️ الرابط غير صالح. الرجاء إدخال رابط تيك توك صحيح.';
                errorDisplay.style.color = '#fbbf24';
                return;
            }

            errorDisplay.textContent = '';
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<span class="icon-dl">⏳</span> جاري التحميل...';

            try {
                // إرسال الطلب إلى API
                const response = await fetch(`${API_URL}?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if (data.code !== 0 || !data.data) {
                    throw new Error('الرابط غير صحيح أو الفيديو غير موجود.');
                }

                // الحصول على أعلى دقة (hdplay) أو fallback (play)
                let videoUrl = data.data.hdplay || data.data.play;
                if (!videoUrl) {
                    throw new Error('لم نتمكن من استخراج رابط الفيديو.');
                }

                // بدء التحميل عبر إنشاء رابط مؤقت
                const a = document.createElement('a');
                a.href = videoUrl;
                a.download = `tiktok_${Date.now()}.mp4`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                errorDisplay.textContent = '✅ تم بدء التحميل بأعلى دقة!';
                errorDisplay.style.color = '#34d399';

            } catch (error) {
                errorDisplay.textContent = `❌ فشل التحميل: ${error.message || 'خطأ غير متوقع'}`;
                errorDisplay.style.color = '#f87171';
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<span class="icon-dl">⬇️</span> تحميل بأعلى دقة';
            }
        });

        // ============================================================
        //  5. منع السكرولنج نهائياً (تأكيد)
        // ============================================================
        window.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
        window.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp') {
                e.preventDefault();
            }
        });

        // ============================================================
        //  6. رسالة ترحيب أولية
        // ============================================================
        console.log('🪐 متصفح SZ - TikTok Downloader Pro');
        console.log('✨ مرحباً بك! الصق الرابط وانطلق.');

        // ============================================================
        //  7. دعم الضغط على Enter في حقل الإدخال
        // ============================================================
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                downloadBtn.click();
            }
        });

        // تحذير: في حال عدم وجود صوت Web Audio (نادر) نستخدم fallback
        console.log('🔊 أصوات النقرات مفعلة (Web Audio).');
    </script>
</body>
</html>
