<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مشفّر سكربتات روبلوكس - أقوى تشفير</title>
    <!-- CryptoJS for SHA-256 and random generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js">
    </script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 20px;
            direction: rtl;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: rgba(22, 28, 46, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px 35px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f0e9ff 0%, #b7a9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px rgba(150, 120, 255, 0.2);
        }

        .header p {
            color: #9aa4c9;
            font-size: 1rem;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        /* ===== CAPTCHA ===== */
        .captcha-wrapper {
            background: rgba(12, 16, 28, 0.7);
            border-radius: 28px;
            padding: 24px 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: 0.3s;
        }

        .captcha-wrapper .question {
            color: #d3daf5;
            font-size: 1.15rem;
            font-weight: 500;
        }

        .captcha-wrapper .question span {
            color: #b7a9ff;
            font-weight: 700;
            margin: 0 6px;
        }

        .captcha-wrapper input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: 12px 22px;
            color: #fff;
            font-size: 1rem;
            width: 110px;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        .captcha-wrapper input:focus {
            border-color: #7a6aff;
            box-shadow: 0 0 0 3px rgba(122, 106, 255, 0.25);
        }

        .captcha-wrapper .btn-verify {
            background: linear-gradient(135deg, #6f5cff, #4a3bcf);
            border: none;
            padding: 12px 30px;
            border-radius: 60px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 18px rgba(79, 58, 255, 0.25);
            letter-spacing: 0.4px;
        }

        .captcha-wrapper .btn-verify:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 28px rgba(79, 58, 255, 0.4);
        }

        .captcha-wrapper .btn-verify:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .captcha-status {
            color: #ff7a7a;
            font-size: 0.9rem;
            width: 100%;
            text-align: center;
            margin-top: 4px;
            min-height: 24px;
        }

        /* ===== FILE UPLOAD ===== */
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 32px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            transition: 0.3s;
            margin-bottom: 28px;
            position: relative;
        }

        .upload-area.dragover {
            border-color: #7a6aff;
            background: rgba(122, 106, 255, 0.05);
        }

        .upload-area .icon {
            font-size: 3.2rem;
            margin-bottom: 8px;
            display: block;
            opacity: 0.5;
        }

        .upload-area p {
            color: #b8c2e6;
            font-size: 1.05rem;
        }

        .upload-area .file-name {
            color: #b7a9ff;
            font-weight: 600;
            margin-top: 6px;
            font-size: 0.95rem;
            word-break: break-all;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-area .btn-upload {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 34px;
            border-radius: 60px;
            color: #d3daf5;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 16px;
            display: inline-block;
            font-size: 0.95rem;
        }

        .upload-area .btn-upload:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #7a6aff;
        }

        .upload-area .btn-upload:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== ACTION BUTTONS ===== */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin: 20px 0 16px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7a6aff, #5b48e0);
            border: none;
            padding: 14px 42px;
            border-radius: 60px;
            color: #fff;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 24px rgba(79, 58, 255, 0.3);
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 36px rgba(79, 58, 255, 0.45);
        }

        .btn-primary:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 34px;
            border-radius: 60px;
            color: #d3daf5;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12);
            border-color: #7a6aff;
        }

        .btn-secondary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== OUTPUT ===== */
        .output-wrapper {
            margin-top: 28px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 28px;
            padding: 18px 22px 22px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: none;
            /* shown after encryption */
        }

        .output-wrapper.show {
            display: block;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(18px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .output-wrapper textarea {
            width: 100%;
            height: 240px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 18px 20px;
            color: #e8edff;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            resize: vertical;
            outline: none;
            transition: 0.3s;
            line-height: 1.6;
            direction: ltr;
            text-align: left;
        }

        .output-wrapper textarea:focus {
            border-color: #7a6aff;
        }

        .output-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
            gap: 14px;
            flex-wrap: wrap;
        }

        .output-footer .btn-copy {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 30px;
            border-radius: 60px;
            color: #b8c2e6;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .output-footer .btn-copy:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #7a6aff;
            color: #fff;
        }

        .output-footer .btn-copy.copied {
            background: rgba(80, 200, 120, 0.15);
            border-color: #50c878;
            color: #50c878;
        }

        /* ===== STATUS / MESSAGES ===== */
        .status-msg {
            color: #b8c2e6;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 12px;
            min-height: 28px;
        }

        .status-msg.error {
            color: #ff7a7a;
        }

        .status-msg.success {
            color: #7ae0a0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container {
                padding: 24px 18px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .captcha-wrapper {
                flex-direction: column;
                gap: 14px;
                padding: 20px 16px;
            }
            .captcha-wrapper input {
                width: 80%;
            }
            .actions {
                flex-direction: column;
                align-items: center;
            }
            .btn-primary,
            .btn-secondary {
                width: 100%;
                justify-content: center;
            }
            .output-wrapper textarea {
                height: 180px;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a3bcf;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <h1>⚡ تشفير سكربتات روبلوكس</h1>
            <p>أقوى تشفير متعدد الطبقات مع حماية ضد الهندسة العكسية</p>
        </div>

        <!-- CAPTCHA -->
        <div class="captcha-wrapper" id="captchaWrapper">
            <div class="question">
                🤖 تحقق إنساني: <span id="captchaQuestion">5 + 8</span> = ?
            </div>
            <input type="number" id="captchaInput" placeholder="?" autocomplete="off" />
            <button class="btn-verify" id="btnVerify">تحقّق</button>
            <div class="captcha-status" id="captchaStatus"></div>
        </div>

        <!-- UPLOAD AREA -->
        <div class="upload-area" id="uploadArea">
            <span class="icon">📂</span>
            <p>اسحب ملف السكربت هنا أو اضغط للاختيار</p>
            <div class="file-name" id="fileName"></div>
            <button class="btn-upload" id="btnUpload">اختر ملف</button>
            <input type="file" id="fileInput" accept=".lua,.txt,.rbxm,.rbxl,.rbxlx,.rbxmx,.txt,.js,.py,.json" />
        </div>

        <!-- ACTIONS -->
        <div class="actions">
            <button class="btn-primary" id="btnEncrypt" disabled>
                🔐 تشفير السكربت
            </button>
            <button class="btn-secondary" id="btnReset">
                ↩️ إعادة تعيين
            </button>
        </div>

        <!-- STATUS -->
        <div class="status-msg" id="statusMsg">⏳ انتظر رفع ملف لتشفيره</div>

        <!-- OUTPUT -->
        <div class="output-wrapper" id="outputWrapper">
            <textarea id="outputText" readonly></textarea>
            <div class="output-footer">
                <button class="btn-copy" id="btnCopy">📋 نسخ النص المشفر</button>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  CONFIG & STATE
        // ============================================================
        const STATE = {
            captchaPassed: false,
            fileContent: null,
            fileName: '',
            encryptedText: '',
        };

        // ============================================================
        //  DOM REFS
        // ============================================================
        const captchaQuestion = document.getElementById('captchaQuestion');
        const captchaInput = document.getElementById('captchaInput');
        const btnVerify = document.getElementById('btnVerify');
        const captchaStatus = document.getElementById('captchaStatus');

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const btnUpload = document.getElementById('btnUpload');
        const fileName = document.getElementById('fileName');

        const btnEncrypt = document.getElementById('btnEncrypt');
        const btnReset = document.getElementById('btnReset');
        const statusMsg = document.getElementById('statusMsg');

        const outputWrapper = document.getElementById('outputWrapper');
        const outputText = document.getElementById('outputText');
        const btnCopy = document.getElementById('btnCopy');

        // ============================================================
        //  CAPTCHA LOGIC (simple math)
        // ============================================================
        let captchaAnswer = 0;

        function generateCaptcha() {
            const a = Math.floor(Math.random() * 10) + 1;
            const b = Math.floor(Math.random() * 10) + 1;
            captchaQuestion.textContent = `${a} + ${b}`;
            captchaAnswer = a + b;
            captchaInput.value = '';
            captchaStatus.textContent = '';
            captchaStatus.className = 'captcha-status';
            btnVerify.disabled = false;
            captchaInput.disabled = false;
        }

        btnVerify.addEventListener('click', function() {
            const val = parseInt(captchaInput.value.trim(), 10);
            if (isNaN(val)) {
                captchaStatus.textContent = '❌ أدخل رقماً صحيحاً';
                captchaStatus.className = 'captcha-status error';
                return;
            }
            if (val === captchaAnswer) {
                captchaStatus.textContent = '✅ تم التحقق بنجاح!';
                captchaStatus.className = 'captcha-status success';
                STATE.captchaPassed = true;
                btnVerify.disabled = true;
                captchaInput.disabled = true;
                // enable upload
                btnUpload.disabled = false;
                uploadArea.style.borderColor = 'rgba(122,106,255,0.3)';
                statusMsg.textContent = '✅ تم التحقق، يمكنك رفع الملف الآن.';
                statusMsg.className = 'status-msg success';
            } else {
                captchaStatus.textContent = '❌ إجابة خاطئة، حاول مجدداً';
                captchaStatus.className = 'captcha-status error';
                // regenerate? keep same question or new? we'll keep same
            }
        });

        // allow Enter key on captcha input
        captchaInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') btnVerify.click();
        });

        // ============================================================
        //  FILE UPLOAD
        // ============================================================
        btnUpload.addEventListener('click', () => fileInput.click());

        // Drag & Drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (!STATE.captchaPassed) {
                statusMsg.textContent = '⚠️ يرجى اجتياز التحقق الإنساني أولاً.';
                statusMsg.className = 'status-msg error';
                return;
            }
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', function() {
            if (!STATE.captchaPassed) {
                statusMsg.textContent = '⚠️ يرجى اجتياز التحقق الإنساني أولاً.';
                statusMsg.className = 'status-msg error';
                fileInput.value = '';
                return;
            }
            if (this.files.length > 0) {
                handleFile(this.files[0]);
            }
        });

        function handleFile(file) {
            const validTypes = [
                'text/plain',
                'application/lua',
                'text/x-lua',
                'application/x-lua',
                'text/x-script.lua',
                'application/octet-stream'
            ];
            // accept by extension too
            const ext = file.name.split('.').pop().toLowerCase();
            const allowedExts = ['lua', 'txt', 'rbxm', 'rbxl', 'rbxlx', 'rbxmx', 'js', 'py', 'json'];
            if (!allowedExts.includes(ext) && !validTypes.includes(file.type)) {
                statusMsg.textContent = '⚠️ نوع الملف غير مدعوم. يرجى رفع ملف نصي أو لوا.';
                statusMsg.className = 'status-msg error';
                fileInput.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                STATE.fileContent = e.target.result;
                STATE.fileName = file.name;
                fileName.textContent = `📎 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
                btnEncrypt.disabled = false;
                statusMsg.textContent = '✅ تم رفع الملف بنجاح، اضغط "تشفير" الآن.';
                statusMsg.className = 'status-msg success';
                // hide old output if any
                outputWrapper.classList.remove('show');
                btnCopy.textContent = '📋 نسخ النص المشفر';
                btnCopy.classList.remove('copied');
            };
            reader.onerror = function() {
                statusMsg.textContent = '❌ خطأ في قراءة الملف.';
                statusMsg.className = 'status-msg error';
            };
            reader.readAsText(file, 'UTF-8');
        }

        // ============================================================
        //  ENCRYPTION ENGINE (multi-layer XOR + Base64 with key derivation)
        // ============================================================
        // We use CryptoJS for SHA-256 to derive a strong 256-byte key
        // Then we apply 5 rounds: XOR with key (shifted) then Base64

        function deriveKey(seed, length) {
            // seed is a string, we hash it with SHA-256 and expand
            const hash = CryptoJS.SHA256(seed).toString(CryptoJS.enc.Hex);
            let key = [];
            // expand hash to desired length by repeating and mixing
            while (key.length < length) {
                const block = CryptoJS.SHA256(hash + key.length + 'x').toString(CryptoJS.enc.Hex);
                for (let i = 0; i < block.length && key.length < length; i += 2) {
                    key.push(parseInt(block.substr(i, 2), 16));
                }
            }
            return key.slice(0, length);
        }

        function xorBytes(data, key, offset) {
            const result = new Uint8Array(data.length);
            for (let i = 0; i < data.length; i++) {
                const k = key[(i + offset) % key.length];
                result[i] = data[i] ^ k;
            }
            return result;
        }

        function toBase64(uint8) {
            return btoa(String.fromCharCode.apply(null, uint8));
        }

        function fromBase64(str) {
            const binary = atob(str);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        function encryptText(plainText) {
            // 1. Convert to UTF-8 bytes
            const encoder = new TextEncoder();
            let data = encoder.encode(plainText);

            // 2. Generate a strong key from a random seed + timestamp
            const seed = CryptoJS.lib.WordArray.random(32).toString() + Date.now() + 'RobloxSecure2026';
            const key = deriveKey(seed, 256); // 256 bytes

            // 3. Apply 5 rounds
            for (let round = 0; round < 5; round++) {
                // XOR with key shifted by round*17
                data = xorBytes(data, key, round * 17);
                // then Base64
                const b64 = toBase64(data);
                data = new Uint8Array(b64.length);
                for (let i = 0; i < b64.length; i++) {
                    data[i] = b64.charCodeAt(i);
                }
            }

            // 4. Final Base64 of the whole result (text representation)
            const finalB64 = toBase64(data);

            // 5. Return encrypted payload + the key (encoded as hex string) and seed info
            // We'll embed the key into the Lua code.
            // For security, we also store the seed inside the key generation in Lua.
            // But we need to pass the key to Lua. We'll store it as hex.
            const keyHex = Array.from(key).map(b => b.toString(16).padStart(2, '0')).join('');
            return {
                encrypted: finalB64,
                keyHex: keyHex,
                seed: seed,
            };
        }

        // ============================================================
        //  GENERATE LUA DECRYPTOR + OBFUSCATED CODE
        // ============================================================
        function generateLuaWrapper(encryptedB64, keyHex) {
            // We'll produce a Lua script that:
            // - contains the encrypted string
            // - contains the key as a table (generated from hex)
            // - contains base64 decoder (simple)
            // - decrypts with reverse rounds: base64 decode, XOR
            // - executes with loadstring

            // Build key table from hex string (split into pairs)
            const keyBytes = [];
            for (let i = 0; i < keyHex.length; i += 2) {
                keyBytes.push(parseInt(keyHex.substr(i, 2), 16));
            }
            // we will put the key as a Lua table, but split into 4 parts to obfuscate
            const partSize = Math.floor(keyBytes.length / 4);
            const parts = [];
            for (let i = 0; i < 4; i++) {
                const start = i * partSize;
                const end = (i === 3) ? keyBytes.length : start + partSize;
                parts.push(keyBytes.slice(start, end));
            }

            // Lua code template
            let lua = `
        -- ====================================================
        --  Deobfuscator / Decryptor for Roblox Script
        --  Generated by SecureCipher v3.0
        -- ====================================================
        local _ENV = getfenv and getfenv() or _ENV
        local _G = _G or getfenv(0)

        -- base64 decoder (RFC 4648)
        local function b64dec(data)
            local b='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
            local t={}
            for i=1,#data,4 do
                local a,b,c,d = b:find(data:sub(i,i)), b:find(data:sub(i+1,i+1)), b:find(data:sub(i+2,i+2)), b:find(data:sub(i+3,i+3))
                if not a then a=0 end
                if not b then b=0 end
                if not c then c=0 end
                if not d then d=0 end
                local n = (a-1)*262144 + (b-1)*4096 + (c-1)*64 + (d-1)
                local n1 = math.floor(n/65536)
                local n2 = math.floor((n%65536)/256)
                local n3 = n%256
                table.insert(t, string.char(n1))
                if c~=0 then table.insert(t, string.char(n2)) end
                if d~=0 then table.insert(t, string.char(n3)) end
            end
            return table.concat(t)
        end

        -- XOR decrypt with key (table of bytes)
        local function xor_dec(data, key, offset)
            local res = {}
            for i=1,#data do
                local ki = ((i-1+offset)%#key)+1
                local byte = string.byte(data, i)
                if byte then
                    res[i] = string.char(bit32.bxor(byte, key[ki]))
                end
            end
            return table.concat(res)
        end

        -- ====================================================
        --  Encrypted payload (base64)
        -- ====================================================
        local enc = "${encryptedB64}"

        // ============================================================
        //  ENCRYPT BUTTON HANDLER
        // ============================================================
        btnEncrypt.addEventListener('click', function() {
            if (!STATE.fileContent) {
                statusMsg.textContent = '⚠️ لا يوجد ملف لرفعه!';
                statusMsg.className = 'status-msg error';
                return;
            }

            // show loading state
            btnEncrypt.disabled = true;
            btnEncrypt.textContent = '⏳ جاري التشفير...';
            statusMsg.textContent = '⏳ تشفير السكربت...';
            statusMsg.className = 'status-msg';

            // Use setTimeout to let UI update
            setTimeout(() => {
                try {
                    const result = encryptText(STATE.fileContent);
                    // generate Lua wrapper
                    const luaScript = generateLuaWrapper(result.encrypted, result.keyHex);

                    STATE.encryptedText = luaScript;

                    // display
                    outputText.value = luaScript;
                    outputWrapper.classList.add('show');

                    statusMsg.textContent = '✅ تم التشفير بنجاح! يمكنك نسخ النص.';
                    statusMsg.className = 'status-msg success';

                    btnCopy.textContent = '📋 نسخ النص المشفر';
                    btnCopy.classList.remove('copied');

                } catch (err) {
                    statusMsg.textContent = '❌ خطأ أثناء التشفير: ' + err.message;
                    statusMsg.className = 'status-msg error';
                } finally {
                    btnEncrypt.disabled = false;
                    btnEncrypt.textContent = '🔐 تشفير السكربت';
                }
            }, 120);
        });

        // ============================================================
        //  COPY BUTTON
        // ============================================================
        btnCopy.addEventListener('click', function() {
            const text = outputText.value;
            if (!text) {
                statusMsg.textContent = '⚠️ لا يوجد نص لنسخه.';
                statusMsg.className = 'status-msg error';
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                btnCopy.textContent = '✅ تم النسخ!';
                btnCopy.classList.add('copied');
                statusMsg.textContent = '📋 تم نسخ النص المشفر إلى الحافظة.';
                statusMsg.className = 'status-msg success';
                setTimeout(() => {
                    btnCopy.textContent = '📋 نسخ النص المشفر';
                    btnCopy.classList.remove('copied');
                }, 3000);
            }).catch(() => {
                // fallback
                outputText.select();
                document.execCommand('copy');
                btnCopy.textContent = '✅ تم النسخ!';
                btnCopy.classList.add('copied');
                setTimeout(() => {
                    btnCopy.textContent = '📋 نسخ النص المشفر';
                    btnCopy.classList.remove('copied');
                }, 3000);
                statusMsg.textContent = '📋 تم نسخ النص (طريقة بديلة).';
                statusMsg.className = 'status-msg success';
            });
        });

        // ============================================================
        //  RESET BUTTON
        // ============================================================
        btnReset.addEventListener('click', function() {

            STATE.fileContent = null;

            STATE.encryptedText = '';
            fileInput.value = '';
            fileName.textContent = '';
            btnEncrypt.disabled = true;
            outputWrapper.classList.remove('show');

            statusMsg.className = 'status-msg';
            btnCopy.textContent = '📋 نسخ النص المشفر';
            btnCopy.classList.remove('copied');
            // reset captcha? keep it passed, but allow to reset captcha? we'll keep it
            // if user wants to reset captcha they can refresh page
            // but we can regenerate captcha if not passed
            if (!STATE.captchaPassed) {
                generateCaptcha();
            } else {
                // if captcha passed, keep it
                // but we can still allow re-upload
            }
            // re-enable upload if captcha passed
            if (STATE.captchaPassed) {
                btnUpload.disabled = false;
            } else {
                btnUpload.disabled = true;
            }
        });

        // ============================================================
        //  INIT
        // ============================================================
        generateCaptcha();
        btnUpload.disabled = true;
        btnEncrypt.disabled = true;
        statusMsg.textContent = '🔐 اجتياز الكابتشا أولاً لرفع الملف.';
    </script>
