<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SZ Ultra | TikTok Downloader</title>
    <style>
        /* ===== RESET & GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #070011;
            color: #fff;
        }
        /* ===== STARFIELD ===== */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 30% 20%, #1a0030, #05000a);
        }
        /* ===== MAIN LAYER ===== */
        .main-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* ===== PRE-CHECK SCREEN ===== */
        #preCheck {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(7, 0, 17, 0.97);
            backdrop-filter: blur(12px);
            transition: opacity 0.9s ease, visibility 0.9s ease;
        }
        #preCheck.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .check-title {
            font-size: 28px;
            font-weight: 700;
            color: #f0e6ff;
            text-shadow: 0 0 40px #7c3aed88;
            margin-bottom: 50px;
            letter-spacing: 1px;
            text-align: center;
        }
        .check-title span {
            background: linear-gradient(135deg, #fbbf24, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .check-item {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 28px;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .check-item.show {
            opacity: 1;
            transform: translateX(0);
        }
        .check-item .ring-mini {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #c084fc;
            border-right-color: #7c3aed;
            animation: spin-ring 1.4s linear infinite;
            flex-shrink: 0;
        }
        .check-item.done .ring-mini {
            border-color: #34d399;
            animation: none;
            background: #34d39933;
            border: 3px solid #34d399;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .check-item.done .ring-mini::after {
            content: "✓";
            color: #34d399;
            font-weight: 700;
        }
        .check-item .label {
            font-size: 20px;
            font-weight: 500;
            color: #c4b5d4;
        }
        .check-item.done .label {
            color: #a78bfa;
        }
        @keyframes spin-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* ===== GLASS CARD (MAIN) ===== */
        .glass-card {
            max-width: 720px;
            width: 100%;
            background: rgba(18, 5, 38, 0.78);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(160, 100, 255, 0.3);
            border-radius: 56px;
            padding: 48px 42px;
            box-shadow: 0 40px 100px rgba(80, 0, 200, 0.5), 0 0 150px rgba(120, 50, 255, 0.15);
            text-align: center;
            opacity: 0;
            transform: scale(0.94) translateY(40px);
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-card.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 4px;
        }
        .brand-icon {
            font-size: 42px;
            background: linear-gradient(145deg, #fbbf24, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand h1 {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #c084fc, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .sub-title {
            color: #a78bfa;
            font-size: 16px;
            font-weight: 300;
            border-bottom: 1px solid #2d1b4a;
            padding-bottom: 18px;
            margin-bottom: 20px;
            letter-spacing: 0.3px;
        }
        .sub-title span {
            color: #fbbf24;
            font-weight: 600;
        }
        /* ===== IP DISPLAY ===== */
        .ip-display {
            background: rgba(10, 0, 25, 0.5);
            border-radius: 60px;
            padding: 8px 20px;
            display: inline-block;
            margin-bottom: 18px;
            border: 1px solid #3b1f66;
            font-size: 14px;
            color: #8b6aaa;
        }
        .ip-display strong {
            color: #c084fc;
            font-weight: 600;
            direction: ltr;
            display: inline-block;
        }
        /* ===== INPUT WRAPPER ===== */
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 0, 25, 0.7);
            border: 2px solid #3b1f66;
            border-radius: 80px;
            padding: 4px 4px 4px 24px;
            transition: 0.3s;
            box-shadow: inset 0 2px 20px rgba(0,0,0,0.7);
            margin-bottom: 18px;
        }
        .input-wrapper:focus-within {
            border-color: #c084fc;
            box-shadow: 0 0 40px #7c3aed66, inset 0 2px 20px #000;
        }
        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 18px 0;
            color: #f0e6ff;
            font-size: 17px;
            outline: none;
            min-width: 0;
            direction: ltr;
        }
        .input-wrapper input::placeholder {
            color: #6b4e8a;
            font-weight: 300;
        }
        .paste-btn {
            background: #2d1b4a;
            border: none;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            color: #c4b5d4;
            font-size: 22px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid #4a2a6e;
        }
        .paste-btn:hover {
            background: #7c3aed;
            color: #fff;
            box-shadow: 0 0 40px #7c3aed99;
            transform: scale(1.05);
        }
        .paste-btn:active { transform: scale(0.92); }
        /* ===== DOWNLOAD BUTTON ===== */
        .download-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(145deg, #8b5cf6, #6d28d9);
            border: none;
            border-radius: 80px;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 45px #6d28d977;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 6px;
        }
        .download-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 12px 60px #7c3aedbb;
            background: linear-gradient(145deg, #9d71fd, #7c3aed);
        }
        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .download-btn .icon-dl {
            font-size: 26px;
        }
        /* ===== ERROR & STATUS ===== */
        .error-msg {
            color: #f87171;
            font-size: 15px;
            margin-top: 16px;
            min-height: 28px;
            font-weight: 500;
            background: #2a0f1a44;
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid #7f1d2d33;
            display: inline-block;
            backdrop-filter: blur(4px);
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
            color: #5a3d7a;
            font-size: 13px;
            border-top: 1px solid #1f0e33;
            padding-top: 16px;
        }
        .status-bar .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #a78bfa;
            border-radius: 50%;
            margin-left: 8px;
            animation: pulse-dot 1.6s infinite;
        }
        @keyframes pulse-dot {
            0% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.8); }
        }
        .status-bar .version {
            background: #1f0e33;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 11px;
            color: #8b6aaa;
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .glass-card { padding: 30px 18px; border-radius: 36px; }
            .brand h1 { font-size: 24px; }
            .input-wrapper { padding: 2px 2px 2px 14px; }
            .input-wrapper input { padding: 14px 0; font-size: 14px; }
            .paste-btn { width: 48px; height: 48px; font-size: 18px; }
            .download-btn { font-size: 18px; padding: 16px; }
            .check-title { font-size: 20px; }
            .check-item .label { font-size: 16px; }
            .ip-display { font-size: 12px; }
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <!-- STARFIELD -->
    <canvas id="starfield"></canvas>

    <!-- ===== PRE-CHECK OVERLAY ===== -->
    <div id="preCheck">
        <div class="check-title">
            ⏳ انتظر <span>التحقق</span> من أنك إنسان ولست برنامج روبوت
        </div>
        <div class="check-item" id="itemHuman">
            <div class="ring-mini"></div>
            <span class="label">يتم التحقق من أنك إنسان ولست برنامج روبوت</span>
        </div>
        <div class="check-item" id="itemIP">
            <div class="ring-mini"></div>
            <span class="label">يتم فحص IP الخاص بك</span>
        </div>
    </div>

    <!-- ===== MAIN UI ===== -->
    <div class="main-layer">
        <div class="glass-card" id="mainCard">
            <div class="brand">
                <span class="brand-icon">🪐</span>
                <h1>متصفح SZ</h1>
            </div>
            <div class="sub-title">
                <span>✦</span> تحميل فيديوهات تيك توك بدون علامة مائية <span>✦</span><br>
                بأعلى دقة ممكنة • تحميل فوري
            </div>

            <!-- عرض IP -->
            <div class="ip-display">
                🌐 <strong id="userIP">جاري جلب IP...</strong>
            </div>

            <div class="input-wrapper">
                <input type="url" id="tiktokInput" placeholder="https://www.tiktok.com/@user/video/..." dir="ltr">
                <button class="paste-btn" id="pasteBtn" title="لصق آخر رابط من الحافظة">📋</button>
            </div>

            <button class="download-btn" id="downloadBtn">
                <span class="icon-dl">⬇️</span> تحميل بأعلى دقة
            </button>

            <div id="errorDisplay" class="error-msg"></div>

            <div class="status-bar">
                <span><span class="dot"></span> جاهز للتحميل</span>
                <span class="version">v4.0 • SZ</span>
            </div>
        </div>
    </div>

    <script>
        // ==========================================================
        //  1. STARFIELD
        // ==========================================================
        (function initStars() {
            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            let w, h;
            const stars = [];
            const COUNT = 300;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < COUNT; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 2.4 + 0.5,
                    speed: Math.random() * 0.9 + 0.2,
                    opacity: Math.random() * 0.8 + 0.2,
                    twinkle: Math.random() * 0.025 + 0.005
                });
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);
                const grad = ctx.createRadialGradient(w * 0.5, h * 0.2, 100, w * 0.5, h * 0.3, h * 1.4);
                grad.addColorStop(0, '#1b0038');
                grad.addColorStop(0.7, '#0a0018');
                grad.addColorStop(1, '#030008');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                for (let s of stars) {
                    s.y -= s.speed;
                    if (s.y < -10) { s.y = h + 10;
                        s.x = Math.random() * w; }
                    const flicker = Math.sin(Date.now() * s.twinkle) * 0.25 + 0.75;
                    const alpha = s.opacity * flicker;
                    const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 3);
                    grd.addColorStop(0, `rgba(200, 170, 255, ${alpha})`);
                    grd.addColorStop(0.4, `rgba(140, 80, 220, ${alpha * 0.5})`);
                    grd.addColorStop(1, `rgba(80, 20, 150, 0)`);
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size * 3, 0, Math.PI * 2);
                    ctx.fillStyle = grd;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 248, 255, ${alpha * 0.9})`;
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // ==========================================================
        //  2. PRE-CHECK SEQUENCE (3 seconds)
        // ==========================================================
        (function preCheck() {
            const preCheck = document.getElementById('preCheck');
            const mainCard = document.getElementById('mainCard');
            const itemHuman = document.getElementById('itemHuman');
            const itemIP = document.getElementById('itemIP');

            // إظهار العنصر الأول بعد 0.5 ثانية
            setTimeout(() => {
                itemHuman.classList.add('show');
            }, 500);

            // إتمام الأول وإظهار الثاني بعد 1.8 ثانية
            setTimeout(() => {
                itemHuman.classList.add('done');
                itemIP.classList.add('show');
            }, 1800);

            // إتمام الثاني بعد 3 ثواني ثم إخفاء الشاشة وإظهار البطاقة
            setTimeout(() => {
                itemIP.classList.add('done');
            }, 3000);

            setTimeout(() => {
                preCheck.classList.add('hidden');
                mainCard.classList.add('visible');
                // صوت بداية
                try {
                    const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = 880;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.25);
                } catch (e) {}
            }, 3600); // 3.6s total (0.6s extra for smoothness)
        })();

        // ==========================================================
        //  3. FETCH USER IP
        // ==========================================================
        (async function fetchIP() {
            const ipEl = document.getElementById('userIP');
            try {
                const resp = await fetch('https://api.ipify.org?format=json');
                const data = await resp.json();
                ipEl.textContent = data.ip || 'غير متاح';
            } catch (e) {
                ipEl.textContent = 'غير متاح';
            }
        })();

        // ==========================================================
        //  4. CLICK SOUND
        // ==========================================================
        function playClick() {
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 1200;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
        }
        document.querySelectorAll('button, .paste-btn, .download-btn').forEach(btn => {
            btn.addEventListener('click', playClick);
        });

        // ==========================================================
        //  5. PASTE BUTTON
        // ==========================================================
        const pasteBtn = document.getElementById('pasteBtn');
        const inputField = document.getElementById('tiktokInput');
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    inputField.value = text.trim();
                    inputField.style.borderColor = '#c084fc';
                    setTimeout(() => inputField.style.borderColor = '', 400);
                }
            } catch (e) {
                try {
                    inputField.focus();
                    document.execCommand('paste');
                } catch (e2) {
                    alert('لا يمكن الوصول للحافظة. الرجاء لصق الرابط يدوياً.');
                }
            }
        });

        // ==========================================================
        //  6. DOWNLOAD FUNCTION (BLOB – NO REDIRECT, NO NEW TAB)
        // ==========================================================
        const downloadBtn = document.getElementById('downloadBtn');
        const errorDisplay = document.getElementById('errorDisplay');
        const API_URL = 'https://www.tikwm.com/api/';

        downloadBtn.addEventListener('click', async () => {
            const url = inputField.value.trim();
            if (!url) {
                errorDisplay.textContent = '‼️ عذراً، أنت لم تضع رابط.';
                errorDisplay.style.color = '#f87171';
                return;
            }
            if (!url.includes('tiktok.com') && !url.includes('vm.tiktok')) {
                errorDisplay.textContent = '⚠️ الرابط غير صالح. يجب أن يكون رابط تيك توك.';
                errorDisplay.style.color = '#fbbf24';
                return;
            }

            errorDisplay.textContent = '';
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<span class="icon-dl">⏳</span> جاري التحميل...';

            try {
                // 1. جلب معلومات الفيديو
                const resp = await fetch(`${API_URL}?url=${encodeURIComponent(url)}`);
                const data = await resp.json();
                if (data.code !== 0 || !data.data) {
                    throw new Error('الرابط غير صحيح أو الفيديو غير متاح.');
                }

                let videoUrl = data.data.hdplay || data.data.play;
                if (!videoUrl) throw new Error('لم نستطع الحصول على رابط الفيديو.');

                // 2. تحميل الفيديو باستخدام fetch blob (ضمان عدم فتح نافذة)
                const videoResp = await fetch(videoUrl);
                if (!videoResp.ok) throw new Error('فشل جلب بيانات الفيديو.');
                const blob = await videoResp.blob();

                // 3. إنشاء رابط تحميل عبر Object URL
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `tiktok_${Date.now()}.mp4`;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                // تحرير الذاكرة بعد فترة
                setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);

                errorDisplay.textContent = '✅ تم بدء التحميل بأعلى دقة!';
                errorDisplay.style.color = '#34d399';

            } catch (error) {
                // في حال فشل fetch blob (مشكلة CORS مثلاً) نستخدم الطريقة التقليدية مع تحذير
                console.warn('Blob download failed, falling back to direct link.', error);
                try {
                    // محاولة استخدام a tag download مباشرة (قد يفتح نافذة في بعض المتصفحات)
                    const a = document.createElement('a');
                    a.href = videoUrl;
                    a.download = `tiktok_${Date.now()}.mp4`;
                    a.target = '_self';
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    errorDisplay.textContent = '✅ تم بدء التحميل (طريقة بديلة)';
                    errorDisplay.style.color = '#fbbf24';
                } catch (e2) {
                    errorDisplay.textContent = `❌ فشل التحميل: ${error.message || 'خطأ غير متوقع'}`;
                    errorDisplay.style.color = '#f87171';
                }
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<span class="icon-dl">⬇️</span> تحميل بأعلى دقة';
            }
        });

        // Enter key
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                downloadBtn.click(); }
        });

        // ==========================================================
        //  7. PREVENT SCROLL
        // ==========================================================
        window.addEventListener('wheel', e => e.preventDefault(), { passive: false });
        window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'PageDown' || e.key === 'PageUp') {
                e.preventDefault();
            }
        });

        console.log('🪐 SZ Ultra v4.0 loaded – IP visible, direct blob download.');
    </script>
</body>
</html>
