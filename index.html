<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delta Bypass Pro - Pure JS</title>
    <!-- ===== التصميم العصري الاحترافي ===== -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            min-height: 100vh;
            background: #080e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            max-width: 960px;
            width: 100%;
            background: #101c30;
            border-radius: 32px;
            padding: 35px 30px;
            border: 1px solid #1f3a5a;
            box-shadow: 0 20px 60px #00000080, 0 0 60px #0077ff15;
        }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
        .badge { background: #00d4ff22; color: #00d4ff; padding: 4px 18px; border-radius: 30px; font-size: 11px; border: 1px solid #00d4ff44; font-weight: 700; letter-spacing: 1px; }
        h1 { color: #fff; font-size: 28px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        h1 span { background: linear-gradient(135deg, #00d4ff, #0066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub { color: #8aa3c9; padding: 10px 0 20px 0; border-bottom: 1px solid #1f2f44; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; }
        .sub code { background: #0a1520; padding: 3px 12px; border-radius: 20px; color: #7fbeff; font-size: 12px; }
        .input-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
        .input-area label { color: #b0c8e8; font-size: 13px; font-weight: 600; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; }
        .row input { flex: 1; min-width: 200px; padding: 16px 22px; background: #0a1322; border: 1px solid #28415e; border-radius: 16px; color: #e5f0ff; font-size: 15px; outline: none; transition: 0.3s; }
        .row input:focus { border-color: #00d4ff; box-shadow: 0 0 20px #00d4ff33; }
        .row button {
            padding: 16px 38px;
            background: linear-gradient(145deg, #00c8ff, #0055ff);
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            box-shadow: 0 4px 25px #0044ff55;
            white-space: nowrap;
        }
        .row button:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 40px #0066ffaa; }
        .row button:disabled { opacity: 0.5; cursor: not-allowed; }
        .log-box {
            background: #060c18;
            border-radius: 18px;
            padding: 16px 18px;
            height: 280px;
            overflow-y: auto;
            border: 1px solid #1d3148;
            margin: 18px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #7fbeff;
            box-shadow: inset 0 4px 30px #00000099;
        }
        .log-box::-webkit-scrollbar { width: 5px; }
        .log-box::-webkit-scrollbar-track { background: #060c18; }
        .log-box::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 8px; }
        .log-entry { padding: 5px 0; border-bottom: 1px solid #101e30; display: flex; gap: 14px; }
        .log-time { color: #4a6b8a; min-width: 70px; font-size: 11px; }
        .log-msg { word-break: break-all; }
        .log-msg.ok { color: #00ff88; }
        .log-msg.err { color: #ff4760; }
        .log-msg.inf { color: #ffb347; }
        .log-msg.sys { color: #6f8fbf; }
        .result-panel {
            background: #0a1424;
            border-radius: 16px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid #1e3a5f;
        }
        .result-panel .label { color: #8aa3c9; font-size: 14px; font-weight: 600; }
        .result-panel .key {
            color: #00ff88;
            font-size: 22px;
            font-weight: 700;
            word-break: break-all;
            flex: 1;
            min-width: 120px;
            background: #00000044;
            padding: 6px 16px;
            border-radius: 40px;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
        }
        .copy-btn { background: #1e3a5f; border: none; color: #fff; padding: 10px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.25s; }
        .copy-btn:hover { background: #00d4ff; color: #0a0e17; box-shadow: 0 0 30px #00d4ff66; }
        .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; color: #4a6b8a; font-size: 12px; border-top: 1px solid #14273d; padding-top: 14px; }
        .timer-box { display: flex; align-items: center; gap: 12px; }
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid #1e3a5f; border-top: 3px solid #00d4ff; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .proxy-note { background: #0d1a2b; padding: 6px 14px; border-radius: 40px; border: 1px solid #1a2f47; font-size: 11px; color: #5f82aa; }
        @media (max-width: 600px) { .card { padding: 20px; } .row button { width: 100%; justify-content: center; } }
    </style>
</head>
<body>
<div class="card">

    <!-- الرأس -->
    <div class="header">
        <h1>⚡ <span>Delta Bypass</span></h1>
        <span class="badge">V15 • PURE JS</span>
    </div>
    <div class="sub">
        <span>🚀 يعمل بكامل طاقة المتصفح (بدون خادم خلفي)</span>
        <code>← وكيل CORS مدمج</code>
        <code>← فك Base64 تلقائي</code>
    </div>

    <!-- الإدخال -->
    <div class="input-area">
        <label>📎 الصق رابط دلتا (auth.platorelay.com / lootlabs)</label>
        <div class="row">
            <input type="url" id="linkInput" placeholder="https://auth.platorelay.com/a?d=..." value="https://auth.platorelay.com/a?d=2OgCDAgnXNScdEnlzMC0cmNiYhUADUzyK3SbKGVKKyLiLHsiQaH7Z54A9caSXIi4tumGipkyaktv593OmYM06bnbE3G7bnbry4Ghz3CrrgcxnCcXf7SIcVKdLlnlArUvgYWU9aiVyQKg56j9Tu774wYwjuEkUIk0v1KitK65xP1Hlqw08dCvNzJrR2zHbwDMkXAFosT530WM7XkMveQaXnOjRs0Sm05R8NY6a1wRkzUXbMLBIlAKeqknEWnILZ4ElvBzHzit2i75ewPJ9VLyLCbb3J7AAgw9pnHlJPFn1JnT6tzPkJ25IDAzJNorZizuoOxP4DEfKUYsmACu1Al2I5B463Im2Np8No1widqZRt9LWlvagfGyiOfkG8ApJT22ojh8pO2jQo3WcPENXjjsf0qCo8BGzvtRh7Ar3bwpk4yMPY2FFts1jOz6DYLsTjx8oKvXLlrzJFeCAyLtWvld8JqfHDPEGOWwrgw">
            <button id="runBtn">🚀 بدء التخطي</button>
        </div>
    </div>

    <!-- سجل الأحداث -->
    <div class="log-box" id="logBox">
        <div class="log-entry"><span class="log-time">[نظام]</span><span class="log-msg sys">المحرك جاهز (JavaScript 100%).</span></div>
        <div class="log-entry"><span class="log-time">[نظام]</span><span class="log-msg sys">سيتم استخدام وكيل CORS لقراءة الصفحة النهائية.</span></div>
    </div>

    <!-- نتيجة المفتاح -->
    <div class="result-panel">
        <span class="label">🔑 المفتاح المستخرج:</span>
        <span class="key" id="resultKey">---</span>
        <button class="copy-btn" onclick="copyKey()">📋 نسخ</button>
    </div>

    <!-- الشريط السفلي -->
    <div class="footer">
        <span id="statusText">🟢 جاهز للتخطي</span>
        <div class="timer-box">
            <div class="spinner" id="spinner"></div>
            <span id="timerDisplay">0s</span>
            <span style="color:#1f3145;">|</span>
            <span class="proxy-note">🔄 Proxy: api.allorigins.win</span>
        </div>
    </div>
</div>

<script>
    // =====================================================
    //  خيارات الوكيل (يمكنك تغييره إلى أي وكيل CORS آخر)
    // =====================================================
    const PROXY_URL = "https://api.allorigins.win/raw?url=";

    // =====================================================
    //  عناصر الصفحة
    // =====================================================
    const logBox = document.getElementById('logBox');
    const linkInput = document.getElementById('linkInput');
    const runBtn = document.getElementById('runBtn');
    const resultKey = document.getElementById('resultKey');
    const statusText = document.getElementById('statusText');
    const spinner = document.getElementById('spinner');
    const timerDisplay = document.getElementById('timerDisplay');
    let timerInterval = null;
    let startTime = 0;

    // =====================================================
    //  دوال السجل
    // =====================================================
    function addLog(message, type = 'inf') {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        const time = new Date().toLocaleTimeString('ar-EG', { hour12: false });
        let cls = 'inf';
        if (type === 'ok') cls = 'ok';
        else if (type === 'err') cls = 'err';
        else if (type === 'sys') cls = 'sys';
        entry.innerHTML = `<span class="log-time">[${time}]</span><span class="log-msg ${cls}">${message}</span>`;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
    }

    // =====================================================
    //  نسخ المفتاح
    // =====================================================
    function copyKey() {
        const text = resultKey.innerText;
        if (text && text !== '---' && !text.includes('جاري')) {
            navigator.clipboard.writeText(text).then(() => {
                addLog('✅ تم النسخ للحافظة!', 'ok');
            }).catch(() => {
                const area = document.createElement('textarea');
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
                addLog('✅ تم النسخ (طريقة بديلة)', 'ok');
            });
        } else {
            addLog('⚠️ لا يوجد مفتاح صالح للنسخ.', 'err');
        }
    }

    // =====================================================
    //  دوال فك التشفير الأساسية (تُنفذ في المتصفح)
    // =====================================================
    function extractKeyFromText(text) {
        if (!text) return null;
        // 1- FREE_ + 32 حرف سداسي
        let match = text.match(/FREE_[a-fA-F0-9]{32}/);
        if (match) return match[0];
        // 2- token / key
        match = text.match(/(?:token|key|hash)\s*[:=]\s*["']?([a-fA-F0-9]{32,64})/i);
        if (match) return match[1];
        // 3- سلسلة طويلة (32-64 حرف)
        match = text.match(/\b([A-Za-z0-9_\-]{32,64})\b/);
        if (match) return match[1];
        return null;
    }

    function decodeBase64FromLink(link) {
        // استخراج ?d= أو &data=
        const m = link.match(/[?&](?:d|data)=([^&\s]+)/);
        if (!m) return null;
        let raw = m[1];
        try {
            // فك ترميز URL
            let decoded = decodeURIComponent(raw);
            // فك Base64
            let padded = decoded + '='.repeat((4 - decoded.length % 4) % 4);
            let b64 = atob(padded);
            // بحث عن مفتاح داخله
            return extractKeyFromText(b64) || b64;
        } catch(e) {
            return null;
        }
    }

    // =====================================================
    //  وظيفة التخطي الرئيسية (تعمل على المتصفح)
    // =====================================================
    async function runBypass() {
        const url = linkInput.value.trim();
        if (!url) {
            addLog('⚠️ الرجاء إدخال رابط صالح.', 'err');
            return;
        }

        // إعادة ضبط الواجهة
        resultKey.innerText = '...جاري...';
        addLog(`🚀 بدء التخطي للرابط: ${url.substring(0, 70)}...`, 'inf');
        runBtn.disabled = true;
        runBtn.innerText = '⏳ جارٍ التخطي...';
        spinner.style.display = 'block';
        statusText.innerText = '⏳ جلب البيانات...';
        startTime = Date.now();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timerDisplay.innerText = Math.floor((Date.now() - startTime) / 1000) + 's';
        }, 1000);

        try {
            // ========== الخطوة 1: فك Base64 المحلي (سريع) ==========
            addLog('🔍 الخطوة 1: فك تشفير ?d= محلياً (Base64)...', 'inf');
            let localKey = decodeBase64FromLink(url);
            if (localKey && localKey.length >= 20) {
                // إذا كان يبدأ بـ FREE_ أو طويلاً
                if (localKey.match(/FREE_[a-fA-F0-9]{32}/)) {
                    resultKey.innerText = localKey;
                    addLog(`✅ تم استخراج المفتاح مباشرة من Base64!`, 'ok');
                    statusText.innerText = '✅ اكتمل (بدون طلب خارجي)';
                    // انتظر 11 ثانية ثم انهي
                    await sleep(11000);
                    finalizeRun(localKey);
                    return;
                }
            }

            // ========== الخطوة 2: إرسال الطلب عبر الوكيل ==========
            addLog('🌐 الخطوة 2: إرسال الطلب إلى وكيل CORS...', 'inf');
            const proxyLink = PROXY_URL + encodeURIComponent(url);
            const response = await fetch(proxyLink);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const html = await response.text();
            addLog(`📄 تم جلب الصفحة (حجم: ${html.length} حرف).`, 'sys');

            // ========== الخطوة 3: البحث عن المفتاح في HTML ==========
            addLog('🔍 الخطوة 3: تحليل HTML بحثاً عن FREE_...', 'inf');
            let key = extractKeyFromText(html);
            if (key) {
                resultKey.innerText = key;
                addLog(`✅ تم العثور على المفتاح في الصفحة: ${key}`, 'ok');
                statusText.innerText = '✅ اكتمل (من HTML)';
                await sleep(11000);
                finalizeRun(key);
                return;
            }

            // ========== الخطوة 4: البحث في ملفات JavaScript ==========
            addLog('📜 الخطوة 4: البحث عن روابط JS وتحليلها...', 'inf');
            const jsLinks = html.match(/src\s*=\s*["']([^"']+\.js[^"']*)["']/gi) || [];
            let foundInJS = false;
            for (let jsLink of jsLinks) {
                let clean = jsLink.replace(/src\s*=\s*["']/, '').replace(/["']$/, '');
                let fullJsUrl = new URL(clean, url).href;
                try {
                    let jsResp = await fetch(PROXY_URL + encodeURIComponent(fullJsUrl));
                    if (jsResp.ok) {
                        let jsText = await jsResp.text();
                        let jsKey = extractKeyFromText(jsText);
                        if (jsKey) {
                            resultKey.innerText = jsKey;
                            addLog(`✅ تم العثور على المفتاح داخل JavaScript: ${jsKey}`, 'ok');
                            statusText.innerText = '✅ اكتمل (من JS)';
                            foundInJS = true;
                            await sleep(11000);
                            finalizeRun(jsKey);
                            return;
                        }
                    }
                } catch(e) {}
            }

            // ========== الخطوة 5: فك Base64 من الرابط كحل أخير ==========
            addLog('⚠️ لم يتم العثور على FREE_، نعيد محاولة فك Base64...', 'inf');
            let fallback = decodeBase64FromLink(url);
            if (fallback) {
                // نأخذ أول 40 حرفاً إذا كان طويلاً جداً
                let cleanFallback = fallback.replace(/^FREE_/, '').match(/[a-fA-F0-9]{32}/);
                if (cleanFallback) {
                    let finalKey = `FREE_${cleanFallback[0]}`;
                    resultKey.innerText = finalKey;
                    addLog(`⚠️ تم استخدام مفتاح احتياطي من Base64: ${finalKey}`, 'inf');
                    statusText.innerText = '⚠️ احتياطي (قد يعمل)';
                    await sleep(11000);
                    finalizeRun(finalKey);
                    return;
                }
            }

            // ========== الفشل النهائي ==========
            resultKey.innerText = '❌ لم يُعثر';
            addLog('❌ فشل استخراج المفتاح بعد جميع المحاولات.', 'err');
            statusText.innerText = 'فشل';
            await sleep(11000);
            finalizeRun(null);

        } catch (error) {
            addLog(`🔥 خطأ: ${error.message}`, 'err');
            resultKey.innerText = '🌐 خطأ شبكة';
            statusText.innerText = 'فشل';
            await sleep(11000);
            finalizeRun(null);
        }
    }

    // =====================================================
    //  دالة إنهاء التشغيل (توقف المؤقت والأزرار)
    // =====================================================
    function finalizeRun(key) {
        clearInterval(timerInterval);
        spinner.style.display = 'none';
        runBtn.disabled = false;
        runBtn.innerText = '🚀 بدء التخطي';
        timerDisplay.innerText = '0s';
        if (key) {
            // المفتاح موجود مسبقاً
        } else {
            // لا شيء
        }
        // إذا لم يكن المفتاح موجوداً نضع علامة
    }

    // دالة مساعدة للنوم
    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    // =====================================================
    //  ربط الأزرار والأحداث
    // =====================================================
    runBtn.addEventListener('click', runBypass);
    linkInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') runBypass();
    });

    // =====================================================
    //  سجلات البداية
    // =====================================================
    addLog('🖥️ محرك التخطي قيد التشغيل (جافاسكريبت خالص).', 'sys');
    addLog(`🔗 وكيل CORS المستخدم: ${PROXY_URL}`, 'sys');
    addLog('✅ يمكنك الآن لصق الرابط والضغط على بدء التخطي.', 'sys');
</script>
</body>
</html>
